log_dir: "Models/LJSpeech"
first_stage_path: "first_stage.pth"
save_freq: 2
log_interval: 10
device: "cuda"
epochs_1st: 200 # number of epochs for first stage training (pre-training)
epochs_2nd: 100 # number of peochs for second stage training (joint training)
batch_size: 16
max_len: 400 # maximum number of frames
# ---------------------------------------------------------------------------
# Batching.  With dynamic_batch (recommended) every utterance is put in a
# 0.25 s length bin and padded to the bin length; batches come from a single
# bin and the WHOLE utterance is used for training.  (The original code crops
# every item of a random batch to the shortest one, so segments get shorter
# and more random the larger the batch; set dynamic_batch: false to get it.)
# ---------------------------------------------------------------------------
dynamic_batch: true
# max_batch_frames: mel frames per batch (1 frame = 12.5 ms).  A bin of padded
#   length L gets batch size max_batch_frames // L, so short clips get big
#   batches and long clips small ones.  Defaults to batch_size * max_len.
#   Batch sizes that OOM are reduced automatically, sizes that fit grow back
#   (never to a size that has OOMed), per training phase; the learned sizes are
#   kept in log_dir/batch_sizes_<stage>.json and reused by later runs.
# max_batch_frames: 6400
# max_segment_len: cap (in mel frames) on the training segment length with
#   dynamic_batch; null = whole utterances.  max_len is only used by the
#   legacy path and for the default max_batch_frames.
max_segment_len: null
max_batch_size: 64
# phase_batch_scale: start a phase at a fraction of the budget sizes the first
#   time it is entered, e.g. {second_joint: 0.5}.  Phases: first, first_tma,
#   second, second_diff, second_joint, ft, ft_diff, ft_joint.
# phase_batch_scale: {}
pretrained_model: ""
second_stage_load_pretrained: true # set to true if the pre-trained model is for 2nd stage
load_only_params: false # set to true if do not want to load epoch numbers and optimizer parameters

# ---------------------------------------------------------------------------
# VRAM / speed / stability knobs (every training script supports all of them)
# ---------------------------------------------------------------------------
# mixed_precision: 'no' | 'bf16' | 'fp16'.  bf16 (Ampere+: A100, RTX 30/40,
#   H100) roughly halves activation memory.  fp16 (T4, V100, RTX 20) uses a
#   GradScaler; steps with inf/NaN gradients are skipped automatically.
#   `accelerate launch --mixed_precision=...` is honoured when this is 'no'.
mixed_precision: 'no'
# gradient_checkpointing: recompute the decoder (HiFiGAN/iSTFTNet) residual
#   blocks and the diffusion transformer in the backward pass.  Large cut in
#   activation memory (the decoder dominates it) for ~20-30% more compute.
gradient_checkpointing: false
# use_8bit_optimizer: bitsandbytes AdamW8bit (~4x smaller optimizer state);
#   falls back to AdamW when bitsandbytes is not installed.
use_8bit_optimizer: false
# disc_update_freq: update the discriminators every N generator steps.
disc_update_freq: 1
# diffusion sampler steps per training iteration: randint(min, max) (orig. 3, 5)
diffusion_num_steps_min: 3
diffusion_num_steps_max: 5
# grad_clip_norm: clip each module's gradient norm (null = off).  Steps whose
#   gradients are not finite are always skipped instead of corrupting weights.
grad_clip_norm: null
# lr_schedule: 'constant' (original) or 'warmup_cosine' (10% warmup
#   (lr_warmup) then cosine decay to lr/1000, driven by epoch progress so it
#   is unaffected by changing batch counts).
lr_schedule: 'constant'
num_workers: 2                  # DataLoader workers
allow_tf32: true                # TF32 matmuls/convs on Ampere+ (faster, harmless)
cudnn_benchmark: false          # cuDNN autotuning; only helps with few distinct shapes
cuda_expandable_segments: true  # PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
                                # (less VRAM fragmentation with varying shapes)

F0_path: "Utils/JDC/bst.t7"
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00080.pth"
PLBERT_dir: 'Utils/PLBERT/'

data_params:
  train_data: "Data/train_list.txt"
  val_data: "Data/val_list.txt"
  root_path: "/local/LJSpeech-1.1/wavs"
  OOD_data: "Data/OOD_texts.txt"
  min_length: 50 # sample until texts with this size are obtained for OOD texts

preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300

model_params:
  multispeaker: false

  dim_in: 64 
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80

  n_token: 178 # number of phoneme tokens
  max_dur: 50 # maximum duration of a single phoneme
  style_dim: 128 # style vector size
  
  dropout: 0.2

  # config for decoder
  decoder: 
      type: 'istftnet' # either hifigan or istftnet
      resblock_kernel_sizes: [3,7,11]
      upsample_rates :  [10, 6]
      upsample_initial_channel: 512
      resblock_dilation_sizes: [[1,3,5], [1,3,5], [1,3,5]]
      upsample_kernel_sizes: [20, 12]
      gen_istft_n_fft: 20
      gen_istft_hop_size: 5
      
  # speech language model config
  slm:
      model: 'microsoft/wavlm-base-plus'
      sr: 16000 # sampling rate of SLM
      hidden: 768 # hidden size of SLM
      nlayers: 13 # number of layers of SLM
      initial_channel: 64 # initial channels of SLM discriminator head
  
  # style diffusion model config
  diffusion:
    embedding_mask_proba: 0.1
    # transformer config
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2

    # diffusion distribution config
    dist:
      sigma_data: 0.2 # placeholder for estimate_sigma_data set to false
      estimate_sigma_data: true # estimate sigma_data from the current batch if set to true
      mean: -3.0
      std: 1.0
  
loss_params:
    lambda_mel: 5. # mel reconstruction loss
    lambda_gen: 1. # generator loss
    lambda_slm: 1. # slm feature matching loss
    
    lambda_mono: 1. # monotonic alignment loss (1st stage, TMA)
    lambda_s2s: 1. # sequence-to-sequence loss (1st stage, TMA)
    TMA_epoch: 50 # TMA starting epoch (1st stage)

    lambda_F0: 1. # F0 reconstruction loss (2nd stage)
    lambda_norm: 1. # norm reconstruction loss (2nd stage)
    lambda_dur: 1. # duration loss (2nd stage)
    lambda_ce: 20. # duration predictor probability output CE loss (2nd stage)
    lambda_sty: 1. # style reconstruction loss (2nd stage)
    lambda_diff: 1. # score matching loss (2nd stage)
    
    diff_epoch: 20 # style diffusion starting epoch (2nd stage)
    joint_epoch: 50 # joint training starting epoch (2nd stage)

optimizer_params:
  lr: 0.0001 # general learning rate
  bert_lr: 0.00001 # learning rate for PLBERT
  ft_lr: 0.00001 # learning rate for acoustic modules
  
slmadv_params:
  min_len: 400 # minimum length of samples
  max_len: 500 # maximum length of samples
  batch_percentage: 0.5 # to prevent out of memory, only use half of the original batch size
  iter: 10 # update the discriminator every this iterations of generator update
  thresh: 5 # gradient norm above which the gradient is scaled
  scale: 0.01 # gradient scaling factor for predictors from SLM discriminators
  sig: 1.5 # sigma for differentiable duration modeling
  